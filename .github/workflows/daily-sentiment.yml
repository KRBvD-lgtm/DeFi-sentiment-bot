name: Daily Crypto Sentiment Draft

on:
  schedule:
    # Runs at :10 past every 4H candle close (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC).
    # Cron is always in UTC. Edit the hours list below to change timing.
    - cron: "10 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
